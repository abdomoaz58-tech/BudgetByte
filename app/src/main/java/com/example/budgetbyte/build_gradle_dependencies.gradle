// ════════════════════════════════════════════════════════
//  BudgetByte — build.gradle (Module: app)
//  أضف الـ dependencies دي في قسم dependencies {}
// ════════════════════════════════════════════════════════

dependencies {

    // ── Existing ──────────────────────────────────────────
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // MPAndroidChart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ── ✅ NEW: Security — أضفهم ──────────────────────────

    // 1. EncryptedSharedPreferences (تشفير الميزانية والإعدادات)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // 2. Biometric Lock (بصمة الإصبع / PIN)
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // ── اختياري: تشفير قاعدة البيانات كاملة (SQLCipher) ──
    // لو عاوز تشفير الـ DB نفسها (مش بس الـ SharedPreferences):
    // implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    // implementation 'androidx.sqlite:sqlite-ktx:2.3.1'
}

// ════════════════════════════════════════════════════════
//  تأكد إن الـ repositories في settings.gradle فيها:
//  maven { url 'https://jitpack.io' }   ← عشان MPAndroidChart
